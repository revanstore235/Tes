<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 WhatsApp Bot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; color: #333; }
        .sub { text-align: center; color: #888; margin-bottom: 25px; }
        
        .method-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .method-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            background: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .method-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }
        
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .input-group input {
            flex: 1;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
        }
        .input-group input:focus { outline: none; border-color: #667eea; }
        .input-group button {
            padding: 14px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .input-group button:disabled { opacity: 0.6; }
        
        #result {
            background: #f5f5f5;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            min-height: 100px;
            margin-bottom: 20px;
        }
        .code {
            font-size: 28px;
            font-weight: bold;
            color: #28a745;
            letter-spacing: 4px;
            background: white;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            border: 2px dashed #28a745;
        }
        .qr-container {
            background: white;
            padding: 10px;
            border-radius: 8px;
            display: inline-block;
        }
        .qr-container img { width: 180px; height: 180px; }
        
        .status { text-align: center; color: #666; font-size: 14px; margin-top: 10px; }
        .status.online { color: #28a745; }
        .status.offline { color: #dc3545; }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <h1>🤖 WhatsApp Bot</h1>
        <p class="sub">Pilih metode pairing</p>

        <div class="method-selector">
            <button class="method-btn active" id="btnPairing" onclick="setMethod('pairing')">🔑 Pairing Code</button>
            <button class="method-btn" id="btnQR" onclick="setMethod('qr')">📱 QR Code</button>
        </div>

        <div class="input-group">
            <input type="text" id="phone" placeholder="6281234567890" maxlength="15">
            <button id="btn" onclick="request()">🔑 Get Code</button>
        </div>

        <div id="result">
            <div style="color:#888;">Pilih metode dan masukkan nomor HP</div>
        </div>

        <div class="status" id="status">⏳ Menunggu...</div>
    </div>

    <script>
        let currentMethod = 'pairing';
        let isPairing = false;

        function setMethod(method) {
            currentMethod = method;
            document.getElementById('btnPairing').className = 'method-btn' + (method === 'pairing' ? ' active' : '');
            document.getElementById('btnQR').className = 'method-btn' + (method === 'qr' ? ' active' : '');
            
            const btn = document.getElementById('btn');
            btn.innerHTML = method === 'pairing' ? '🔑 Get Code' : '📱 Get QR';
        }

        async function request() {
            if (isPairing) return;
            
            const phone = document.getElementById('phone').value.trim();
            if (!phone) {
                alert('Masukkan nomor HP!');
                return;
            }
            if (phone.length < 10) {
                alert('Nomor tidak valid!');
                return;
            }

            isPairing = true;
            const btn = document.getElementById('btn');
            btn.disabled = true;
            btn.innerHTML = '⏳ Loading...';

            const result = document.getElementById('result');
            result.innerHTML = '<div class="spinner"></div><div style="color:#888;margin-top:10px;">Meminta...</div>';

            try {
                const res = await fetch('/api/pair', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: phone, method: currentMethod })
                });
                const data = await res.json();

                if (data.success && data.code) {
                    result.innerHTML = `
                        <div style="font-size:44px;">✅</div>
                        <div class="code">${data.code}</div>
                        <div style="color:#666;font-size:13px;">Kode valid 60 detik!</div>
                    `;
                    document.getElementById('status').textContent = '🟢 Kode siap!';
                    document.getElementById('status').className = 'status online';
                    try { navigator.clipboard.writeText(data.code); } catch(e) {}
                } else if (data.success && data.qr) {
                    result.innerHTML = `
                        <div style="font-size:44px;">📱</div>
                        <div class="qr-container">
                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(data.qr)}" alt="QR Code" />
                        </div>
                        <div style="color:#666;font-size:13px;">Scan QR di WhatsApp</div>
                    `;
                    document.getElementById('status').textContent = '📱 Scan QR Code!';
                    document.getElementById('status').className = 'status online';
                } else if (data.success && data.message) {
                    result.innerHTML = `<div style="font-size:44px;">✅</div><div style="font-weight:bold;">${data.message}</div>`;
                } else {
                    result.innerHTML = `<div style="font-size:44px;">❌</div><div style="color:#dc3545;">${data.error || 'Gagal!'}</div>`;
                }
            } catch (e) {
                result.innerHTML = `<div style="font-size:44px;">❌</div><div style="color:#dc3545;">${e.message}</div>`;
            }

            isPairing = false;
            btn.disabled = false;
            btn.innerHTML = currentMethod === 'pairing' ? '🔑 Get Code' : '📱 Get QR';
        }

        document.getElementById('phone').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') request();
        });
        document.getElementById('phone').addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '');
        });

        async function checkStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                const el = document.getElementById('status');
                if (data.status === 'connected') {
                    el.textContent = '🟢 Online';
                    el.className = 'status online';
                } else {
                    el.textContent = '🔴 Offline';
                    el.className = 'status offline';
                }
            } catch(e) {}
        }
        setInterval(checkStatus, 5000);
        checkStatus();
    </script>
</body>
</html>
